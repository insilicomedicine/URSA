name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: |
          uv run flake8 src tests
          uv run black src tests --check
          uv run mypy src
          uv run bandit -c pyproject.toml -r src/ursa

      - name: Tests (unit + test_basic; no integration)
        run: uv run pytest -q tests/unit tests/test_basic.py
