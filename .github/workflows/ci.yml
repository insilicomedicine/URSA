name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minimal local package so `uv sync` can resolve the editable `chemcensor`
      # dependency without cloning the real library. Integration tests under
      # `tests/integration/` are skipped here (they import real ChemCensor).
      - name: ChemCensor CI stub
        run: |
          set -euo pipefail
          mkdir -p chemcensor/chemcensor
          cat > chemcensor/pyproject.toml <<'EOF'
          [project]
          name = "chemcensor"
          version = "0.0.1"
          requires-python = ">=3.12"
          dependencies = []
          [build-system]
          requires = ["setuptools>=61"]
          build-backend = "setuptools.build_meta"
          [tool.setuptools.packages.find]
          where = ["."]
          EOF
          cat > chemcensor/chemcensor/__init__.py <<'EOF'
          class ChemCensor:
              """Placeholder for CI only; install the real package locally."""
              def __init__(self, db_path=None) -> None:
                  self.db_path = db_path
              def score(self, *args, **kwargs):
                  raise RuntimeError(
                      "ChemCensor CI stub: run tests/integration/ with a real "
                      "chemcensor checkout."
                  )
          EOF

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint
        run: |
          uv run flake8 src tests
          uv run black src tests --check
          uv run mypy src
          uv run bandit -c pyproject.toml -r src/ursa

      - name: Tests (unit + test_basic; no integration)
        run: uv run pytest -q tests/unit tests/test_basic.py
